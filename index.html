const err=/wrong|locked|too many|couldn|only the page|required/i.test(m),ok=!err&&/mode|copied/i.test(m);
t.className="toast"+(err?" err":ok?" ok":"");
t.innerHTML='<i class="fa-solid '+(err?"fa-circle-xmark":ok?"fa-circle-check":"fa-circle-info")+'"></i><span>'+m+"</span>";
t.hidden=false;t.style.animation="none";void t.offsetWidth;t.style.animation="";
toast.t=setTimeout(()=>{t.classList.add("out");toast.h=setTimeout(()=>{t.hidden=true;t.classList.remove("out")},300)},ms||2600)}
function buildHtml(next){
const c=document.documentElement.cloneNode(true);
c.querySelector("#app").innerHTML="";c.querySelector("#adm").innerHTML="";c.querySelector("#cm").innerHTML="";c.querySelector("#cm").setAttribute("hidden","");const ts=c.querySelector("#ts");ts.textContent="";ts.className="toast";ts.removeAttribute("style");ts.setAttribute("hidden","");
c.querySelectorAll("style:not(#base-css)").forEach(x=>x.remove());
["data-fa-i2svg","data-theme","style"].forEach(a=>c.removeAttribute(a));
c.querySelector("#cfg").textContent=JSON.stringify(next).replace(/</g,"\\u003c");
return "<!DOCTYPE html>\n"+c.outerHTML}
async function save(next){
toast("Saving…",8000);
try{sessionStorage.setItem("pm-edit","1")}catch(e){}
try{const a=await claude.use("artifact");if(!a)throw{code:"none"};await a.publish(buildHtml(next))}
catch(e){toast(e&&(e.code==="not_writer"||e.code==="not_granted")?"Only the page owner can save changes. Open this page while signed in to your Claude account.":"Couldn’t save. Try again.",4000)}}
function openForm(k,i){

sh.hidden=false;
$("#fc").onclick=()=>{sh.hidden=true};

$("#fs").onclick=()=>{const n=$("#f1").value.trim(),u=$("#f2").value.trim(),l=$("#f3").value.trim();
if(!n||!l){toast("Name and link are required");return}
const next=JSON.parse(JSON.stringify(cfg)),rec={n,u,l};if(k!=="youtube")rec.p=$("#f4").value;
if(i==null)next[k].push(rec);else next[k][i]=rec;

const b=e.target.closest("button");if(!b)return;

else if(b.id==="cp"){const ok=()=>{b.innerHTML='<i class="fa-solid fa-check"></i>';setTimeout(()=>{b.innerHTML='<i class="fa-regular fa-copy"></i>'},1800)};
const fb=()=>{const t=document.createElement("textarea");t.value=EMAIL;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(x){}t.remove()};
try{navigator.clipboard.writeText(EMAIL).then(ok,fb)}catch(x){fb()}}
else if(b.dataset.a==="e")openForm(b.dataset.k,+b.dataset.i);

else{const next=JSON.parse(JSON.stringify(cfg));next[b.dataset.k].splice(+b.dataset.i,1);save(next)}}});
function mountAdmin(){
$("#adm").innerHTML='<div id="sh" class="sh" hidden></div><button id="fab" class="fab"></button>';
const f=$("#fab"),lab=()=>{f.innerHTML=edit?'<i class="fa-solid fa-check"></i> Done editing':'<i class="fa-solid fa-pen"></i> Edit page'};
lab();f.onclick=()=>{edit=!edit;try{sessionStorage.setItem("pm-edit",edit?"1":"0")}catch(e){}lab();render()}}
const getAdm=()=>{try{return localStorage.getItem("pm-adm")==="1"||sessionStorage.getItem("pm-adm")==="1"}catch(e){return false}};
const setAdm=v=>{try{localStorage.setItem("pm-adm",v?"1":"0")}catch(e){}try{sessionStorage.setItem("pm-adm",v?"1":"0")}catch(e){}};
const LK="pm-lock";
const getLk=()=>{try{return JSON.parse(localStorage.getItem(LK)||sessionStorage.getItem(LK)||"{}")}catch(e){return{}}};
const setLk=o=>{const s=JSON.stringify(o);try{localStorage.setItem(LK,s)}catch(e){}try{sessionStorage.setItem(LK,s)}catch(e){}};
const fmt=s=>s>=3600?Math.ceil(s/3600)+" hours":s>=60?Math.ceil(s/60)+" min":s+" sec";
function openCode(){
const L0=getLk(),left=Math.ceil(((L0.until||0)-Date.now())/1000);
if(left>0){toast("Locked. Try again in "+fmt(left),4000);return}
const cm=$("#cm");
cm.innerHTML='<div class="sp" role="dialog" aria-modal="true"><h3>Enter code</h3><label for="cc">Code</label><input id="cc" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><div class="bt"><button id="cx">Cancel</button><button id="co" class="pr">Enter</button></div></div>';
cm.hidden=false;
const go=()=>{const v=$("#cc").value.trim();cm.hidden=true;
if(v==="2008"){setLk({});setAdm(true);edit=true;try{sessionStorage.setItem("pm-edit","1")}catch(e){}mountAdmin();render();toast("Admin mode on")}
else if(v==="6205"){setLk({});setAdm(false);edit=false;try{sessionStorage.setItem("pm-edit","0")}catch(e){}$("#adm").innerHTML="";render();toast("Normal mode")}
else{const L=getLk(),f=(L.f||0)+1;if(f>=13){setLk({f:0,until:Date.now()+864e5});toast("Too many wrong attempts. Locked for 24 hours.",5000)}else{const w=f===1?15:30;setLk({f,until:Date.now()+w*1000});toast("Wrong code. Wait "+w+" sec. Attempts left: "+(13-f),4000)}}};
$("#cx").onclick=()=>{cm.hidden=true};$("#co").onclick=go;
$("#cc").onkeydown=e=>{if(e.key==="Enter")go()};
cm.onclick=e=>{if(e.target===cm)cm.hidden=true};
$("#cc").focus()}
$("#sec").addEventListener("click",openCode);
render();
if(getAdm()){try{edit=sessionStorage.getItem("pm-edit")==="1"}catch(e){}mountAdmin();render()}
</script>


<script id="prime-monk-motion">
(()=>{
  const app=document.getElementById('app');
  if(!app)return;
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reveal=()=>{
    const nodes=app.querySelectorAll(':scope > h2, :scope > .list, :scope > .g2, :scope > .gap, :scope > .cta, :scope > .acc');
    if(reduced){nodes.forEach(n=>n.classList.add('in-view'));return;}
    if(!('IntersectionObserver' in window)){nodes.forEach(n=>n.classList.add('in-view'));return;}
    const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(entry.isIntersecting){entry.target.classList.add('in-view');observer.unobserve(entry.target);}
    }),{threshold:.08,rootMargin:'0px 0px -24px 0px'});
    nodes.forEach((n,i)=>{n.classList.add('reveal');n.style.transitionDelay=(Math.min(i%4,3)*65)+'ms';observer.observe(n);});
  };
  reveal();
  new MutationObserver(()=>requestAnimationFrame(reveal)).observe(app,{childList:true});
})();
</script>

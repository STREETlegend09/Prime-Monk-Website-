function storeHtml(){if(!cfg.store)cfg.store=SEED;
return `<div class="acc"><button class="fold" aria-expanded="${edit}" aria-controls="pn2"><span class="ib" style="--c:var(--a)"><i class="fa-solid fa-store"></i></span><span class="tx"><b>Digital Store</b><span>Logos, link-in-bio pages, websites and more</span></span><i class="fa-solid fa-chevron-right ch"></i></button><div class="pn${edit?" open":""}" id="pn2"><div class="pi"><div class="box">${cfg.store.map(pitem).join("")||'<p class="em">Products coming soon.</p>'}${edit?'<button class="add" data-a="a" data-k="store"><i class="fa-solid fa-plus"></i> Add new product</button>':""}</div></div></div></div>`}
const ICONS={"fa-solid fa-signature":"Signature","fa-solid fa-pen-fancy":"Pen","fa-solid fa-pen-nib":"Pen nib","fa-solid fa-palette":"Palette","fa-solid fa-film":"Film","fa-solid fa-laptop-code":"Code","fa-solid fa-bullhorn":"Megaphone","fa-solid fa-camera":"Camera","fa-solid fa-gamepad":"Gaming","fa-solid fa-star":"Star","fa-solid fa-bolt":"Bolt","fa-solid fa-heart":"Heart","fa-solid fa-globe":"Globe","fa-solid fa-box-open":"Box","fa-solid fa-mobile-screen":"Mobile","fa-solid fa-music":"Music","fa-solid fa-shirt":"Fashion"};
const COLS={"#2f7bff":"Blue","#e0489a":"Pink","#c8932b":"Gold","#8b5cf6":"Purple","#f07a2a":"Orange","#12b886":"Green","#ff2d2d":"Red","#0ea5e9":"Sky blue"};
const dec=s=>String(s).replace(/&amp;/g,"&");
function ensure(){if(!cfg.cat)cfg.cat=cat.map(([i,t,c,l])=>({i,t:dec(t),c,l:l.map(dec)}));if(!cfg.pkg)cfg.pkg=pkg.map(([t,d])=>({t,d}))}
const acts=(k,i)=>`<span class="acts"><button class="ab" data-a="e" data-k="${k}" data-i="${i}" aria-label="Edit"><i class="fa-solid fa-pen"></i></button><button class="ab del" data-a="d" data-k="${k}" data-i="${i}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></span>`;
const addBtn=(k,t)=>`<button class="add" data-a="a" data-k="${k}"><i class="fa-solid fa-plus"></i> ${t}</button>`;
function catHtml(){ensure();
return cfg.cat.map((x,n)=>{const sm=`<span class="ib"><i class="${esc(x.i)}"></i></span><span class="tx"><b>${String(n+1).padStart(2,"0")}. ${esc(x.t)}</b><span>${x.l.length} services</span></span>`;
const chips=`<div class="chips">${x.l.map(y=>`<span class="chip">${esc(y)}</span>`).join("")}</div>`;
if(edit)return `<div class="ct ed" style="--c:${esc(x.c)}"><div class="csum">${sm}${acts("cat",n)}</div>${chips}</div>`;
return `<details class="ct" style="--c:${esc(x.c)}"><summary>${sm}<i class="fa-solid fa-chevron-right ch"></i></summary>${chips}</details>`}).join("")+(edit?addBtn("cat","Add new category"):"")}
function pkgHtml(){ensure();
return cfg.pkg.map((p,i)=>`<div class="pk${edit?" ed":""}"><div class="pkt"><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div>${edit?acts("pkg",i):""}</div>`).join("")+(edit?addBtn("pkg","Add new package"):"")}
function sheet(html){const sh=$("#sh");sh.innerHTML=html;sh.hidden=false;$("#fc").onclick=()=>{sh.hidden=true};sh.onclick=e=>{if(e.target===sh)sh.hidden=true};return sh}
function openCat(i){ensure();
const it=i==null?{i:"fa-solid fa-star",t:"",c:"#c8932b",l:[]}:cfg.cat[i];
const opt=(o,v)=>Object.entries(o).map(([k,n])=>`<option value="${k}"${k===v?" selected":""}>${n}</option>`).join("");
const sh=sheet(`<div class="sp" role="dialog" aria-modal="true"><h3>${i==null?"Add":"Edit"} category</h3><label for="c1">Category name</label><input id="c1" value="${esc(it.t)}"><label for="c2">Icon</label><select id="c2">${opt(ICONS,it.i)}</select><label for="c3">Colour</label><select id="c3">${opt(COLS,it.c)}</select><label for="c4">Services (one per line)</label><textarea id="c4" style="min-height:170px">${esc(it.l.join("\n"))}</textarea><div class="bt"><button id="fc">Cancel</button><button id="fs" class="pr">Save</button></div></div>`);
$("#fs").onclick=()=>{const t=$("#c1").value.trim();if(!t){toast("Name is required");return}
const rec={t,i:$("#c2").value,c:$("#c3").value,l:$("#c4").value.split("\n").map(s=>s.trim()).filter(Boolean)};
const next=JSON.parse(JSON.stringify(cfg));if(i==null)next.cat.push(rec);else next.cat[i]=rec;sh.hidden=true;save(next)};
$("#c1").focus()}
function openPkg(i){ensure();
const it=i==null?{t:"",d:""}:cfg.pkg[i];
const sh=sheet(`<div class="sp" role="dialog" aria-modal="true"><h3>${i==null?"Add":"Edit"} package</h3><label for="p1">Package name</label><input id="p1" value="${esc(it.t)}"><label for="p2">What’s included</label><textarea id="p2">${esc(it.d)}</textarea><div class="bt"><button id="fc">Cancel</button><button id="fs" class="pr">Save</button></div></div>`);
$("#fs").onclick=()=>{const t=$("#p1").value.trim();if(!t){toast("Name is required");return}
const rec={t,d:$("#p2").value.trim()};
const next=JSON.parse(JSON.stringify(cfg));if(i==null)next.pkg.push(rec);else next.pkg[i]=rec;sh.hidden=true;save(next)};
$("#p1").focus()}
function render(){
$("#app").innerHTML=sec("youtube","Watch on YouTube",false)+sec("social","Follow",true)+sec("community","Join the community",true)+
`<div class="gap"></div>
<div class="cta"><a class="cmain" href="${GM}" target="_blank" rel="noopener"><span class="ib"><i class="fa-solid fa-envelope"></i></span><span class="tx"><b>Contact</b><span>${EMAIL}</span></span></a><button class="cp" id="cp" aria-label="Copy email"><i class="fa-regular fa-copy"></i></button></div>
<div class="acc"><button class="fold" id="fd" aria-expanded="${edit}" aria-controls="pn"><span class="ib" style="--c:var(--a)"><i class="fa-solid fa-briefcase"></i></span><span class="tx"><b>Branding &amp; Design Services</b><span>Logos, stationery, packaging and more</span></span><i class="fa-solid fa-chevron-right ch"></i></button>
<div class="pn${edit?" open":""}" id="pn"><div class="pi"><div class="box">
${catHtml()}
<h3 class="m">Branding packages</h3>
${pkgHtml()}
<a class="cta wc" href="${GM}" target="_blank" rel="noopener"><span class="tx"><b>Work &amp; Collaboration</b><span>${EMAIL}</span></span></a>
<p class="sg">Creative • Professional • Reliable</p>
</div></div></div></div>`}
function toast(m,ms){const t=$("#ts");if(!t)return;clearTimeout(toast.t);clearTimeout(toast.h);
const err=/wrong|locked|too many|couldn|only the page|required/i.test(m),ok=!err&&/mode|copied/i.test(m);
t.className="toast"+(err?" err":ok?" ok":"");
t.innerHTML='<i class="fa-solid '+(err?"fa-circle-xmark":ok?"fa-circle-check":"fa-circle-info")+'"></i><span>'+m+"</span>";
t.hidden=false;t.style.animation="none";void t.offsetWidth;t.style.animation="";
toast.t=setTimeout(()=>{t.classList.add("out");toast.h=setTimeout(()=>{t.hidden=true;t.classList.remove("out")},300)},ms||2600)}
function buildHtml(next){
const c=document.documentElement.cloneNode(true);
c.querySelector("#app").innerHTML="";c.querySelector("#adm").innerHTML="";c.querySelector("#cm").innerHTML="";c.querySelector("#cm").setAttribute("hidden","");const ts=c.querySelector("#ts");ts.textContent="";ts.className="toast";ts.removeAttribute("style");ts.setAttribute("hidden","");
c.querySelectorAll("style:not(#base-css)").forEach(x=>x.remove());
["data-fa-i2svg","data-theme","style"].forEach(a=>c.removeAttribute(a));
c.querySelector("#cfg").textContent=JSON.stringify(next).replace(/</g,"\\u003c");
return "<!DOCTYPE html>\n"+c.outerHTML}
async function save(next){
toast("Saving…",8000);
try{sessionStorage.setItem("pm-edit","1")}catch(e){}
try{const a=await claude.use("artifact");if(!a)throw{code:"none"};await a.publish(buildHtml(next))}
catch(e){toast(e&&(e.code==="not_writer"||e.code==="not_granted")?"Only the page owner can save changes. Open this page while signed in to your Claude account.":"Couldn’t save. Try again.",4000)}}
function openForm(k,i){
if(k==="cat")return openCat(i);if(k==="pkg")return openPkg(i);if(k==="store")return openStore(i);
const it=i==null?{n:"",u:"",l:"",p:"auto"}:cfg[k][i];
const sel=k==="youtube"?"":`<label for="f4">Logo</label><select id="f4"><option value="auto">Auto (detect from link)</option>${Object.entries(P).filter(([x])=>x!=="youtube").map(([x,v])=>`<option value="${x}"${it.p===x?" selected":""}>${v[2]}</option>`).join("")}</select>`;
const sh=$("#sh");
sh.innerHTML=`<div class="sp" role="dialog" aria-modal="true"><h3>${i==null?"Add":"Edit"} ${LAB[k]}</h3><label for="f1">Name</label><input id="f1" value="${esc(it.n)}"><label for="f2">Username</label><input id="f2" value="${esc(it.u)}"><label for="f3">Link</label><input id="f3" type="url" inputmode="url" value="${esc(it.l)}">${sel}<div class="bt"><button id="fc">Cancel</button><button id="fs" class="pr">Save</button></div></div>`;
sh.hidden=false;
$("#fc").onclick=()=>{sh.hidden=true};
sh.onclick=e=>{if(e.target===sh)sh.hidden=true};
$("#fs").onclick=()=>{const n=$("#f1").value.trim(),u=$("#f2").value.trim(),l=$("#f3").value.trim();
if(!n||!l){toast("Name and link are required");return}
const next=JSON.parse(JSON.stringify(cfg)),rec={n,u,l};if(k!=="youtube")rec.p=$("#f4").value;
if(i==null)next[k].push(rec);else next[k][i]=rec;
sh.hidden=true;save(next)};
$("#f1").focus()}
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
function openStore(i){
const it=i==null?{t:"",c:"",p:"",d:"",l:"",img:""}:cfg.store[i];
const sh=$("#sh");
sh.innerHTML=`<div class="sp" role="dialog" aria-modal="true"><h3>${i==null?"Add":"Edit"} product</h3><label for="s1">Title</label><input id="s1" value="${esc(it.t)}" placeholder="e.g. Logo Design"><label for="s2">Category</label><input id="s2" value="${esc(it.c)}" placeholder="e.g. Branding"><label for="s3">Price</label><input id="s3" value="${esc(it.p)}" placeholder="e.g. ₹499 or Starting ₹999"><label for="s4">Details</label><textarea id="s4">${esc(it.d)}</textarea><label for="s5">Demo link (optional)</label><input id="s5" type="url" inputmode="url" value="${esc(it.l)}"><label for="s6">Demo image (optional)</label><input id="s6" type="file" accept="image/*">${it.img?'<label class="rm"><input type="checkbox" id="s7"> Remove current image</label>':""}<div class="bt"><button id="fc">Cancel</button><button id="fs" class="pr">Save</button></div></div>`;
sh.hidden=false;
$("#fc").onclick=()=>{sh.hidden=true};sh.onclick=e=>{if(e.target===sh)sh.hidden=true};
$("#fs").onclick=async()=>{const t=$("#s1").value.trim();if(!t){toast("Title is required");return}
let img=it.img||"";if($("#s7")&&$("#s7").checked)img="";
const f=$("#s6").files[0];if(f){try{img=await shrink(f)}catch(e){toast("Couldn’t read that image");return}}
const rec={t,c:$("#s2").value.trim(),p:$("#s3").value.trim(),d:$("#s4").value.trim(),l:$("#s5").value.trim(),img};
const next=JSON.parse(JSON.stringify(cfg));if(i==null)next.store.push(rec);else next.store[i]=rec;sh.hidden=true;save(next)};
$("#s1").focus()}
$("#app").addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
if(b.classList.contains("fold")){const pn=document.getElementById(b.getAttribute("aria-controls")),o=!pn.classList.contains("open");pn.classList.toggle("open",o);b.setAttribute("aria-expanded",o)}
else if(b.id==="cp"){const ok=()=>{b.innerHTML='<i class="fa-solid fa-check"></i>';setTimeout(()=>{b.innerHTML='<i class="fa-regular fa-copy"></i>'},1800)};
const fb=()=>{const t=document.createElement("textarea");t.value=EMAIL;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(x){}t.remove()};
try{navigator.clipboard.writeText(EMAIL).then(ok,fb)}catch(x){fb()}}
else if(b.dataset.a==="e")openForm(b.dataset.k,+b.dataset.i);
else if(b.dataset.a==="a")openForm(b.dataset.k,null);
else if(b.dataset.a==="d"){
if(b.dataset.c!=="1"){b.dataset.c="1";b.innerHTML='<i class="fa-solid fa-check"></i>';toast("Tap again to delete");setTimeout(()=>{if(b.isConnected){b.dataset.c="";b.innerHTML='<i class="fa-solid fa-trash"></i>'}},3000)}
else{const next=JSON.parse(JSON.stringify(cfg));next[b.dataset.k].splice(+b.dataset.i,1);save(next)}}});
function mountAdmin(){
$("#adm").innerHTML='<div id="sh" class="sh" hidden></div><button id="fab" class="fab"></button>';
const f=$("#fab"),lab=()=>{f.innerHTML=edit?'<i class="fa-solid fa-check"></i> Done editing':'<i class="fa-solid fa-pen"></i> Edit page'};
lab();f.onclick=()=>{edit=!edit;try{sessionStorage.setItem("pm-edit",edit?"1":"0")}catch(e){}lab();render()}}
const getAdm=()=>{try{return localStorage.getItem("pm-adm")==="1"||sessionStorage.getItem("pm-adm")==="1"}catch(e){return false}};
const setAdm=v=>{try{localStorage.setItem("pm-adm",v?"1":"0")}catch(e){}try{sessionStorage.setItem("pm-adm",v?"1":"0")}catch(e){}};
const LK="pm-lock";
const getLk=()=>{try{return JSON.parse(localStorage.getItem(LK)||sessionStorage.getItem(LK)||"{}")}catch(e){return{}}};
const setLk=o=>{const s=JSON.stringify(o);try{localStorage.setItem(LK,s)}catch(e){}try{sessionStorage.setItem(LK,s)}catch(e){}};
const fmt=s=>s>=3600?Math.ceil(s/3600)+" hours":s>=60?Math.ceil(s/60)+" min":s+" sec";
function openCode(){
const L0=getLk(),left=Math.ceil(((L0.until||0)-Date.now())/1000);
if(left>0){toast("Locked. Try again in "+fmt(left),4000);return}
const cm=$("#cm");
cm.innerHTML='<div class="sp" role="dialog" aria-modal="true"><h3>Enter code</h3><label for="cc">Code</label><input id="cc" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><div class="bt"><button id="cx">Cancel</button><button id="co" class="pr">Enter</button></div></div>';
cm.hidden=false;
const go=()=>{const v=$("#cc").value.trim();cm.hidden=true;
if(v==="2008"){setLk({});setAdm(true);edit=true;try{sessionStorage.setItem("pm-edit","1")}catch(e){}mountAdmin();render();toast("Admin mode on")}
else if(v==="6205"){setLk({});setAdm(false);edit=false;try{sessionStorage.setItem("pm-edit","0")}catch(e){}$("#adm").innerHTML="";render();toast("Normal mode")}
else{const L=getLk(),f=(L.f||0)+1;if(f>=3){setLk({f:0,until:Date.now()+864e5});toast("Too many wrong attempts. Locked for 24 hours.",5000)}else{const w=f===1?15:30;setLk({f,until:Date.now()+w*1000});toast("Wrong code. Wait "+w+" sec. Attempts left: "+(3-f),4000)}}};
$("#cx").onclick=()=>{cm.hidden=true};$("#co").onclick=go;
$("#cc").onkeydown=e=>{if(e.key==="Enter")go()};
cm.onclick=e=>{if(e.target===cm)cm.hidden=true};
$("#cc").focus()}
(()=>{const s=$("#sec");let t=null;const st=()=>{clearTimeout(t);t=setTimeout(()=>{t=null;openCode()},3000)},en=()=>{clearTimeout(t);t=null};s.addEventListener("pointerdown",st);["pointerup","pointercancel","pointerleave"].forEach(ev=>s.addEventListener(ev,en));s.addEventListener("contextmenu",e=>e.preventDefault())})();
render();
if(getAdm()){try{edit=sessionStorage.getItem("pm-edit")==="1"}catch(e){}mountAdmin();render()}
</script>
